
spring.application.name=tax
server.port=${SERVER_PORT:9090}

#LDAP Configuration
spring.ldap.urls=${LDAP_URL:ldap://host.docker.internal:389}
spring.ldap.base=${LDAP_BASE:cn=admin,dc=mairie,dc=com}
spring.ldap.username=${LDAP_USERNAME:cn=admin,dc=mairie,dc=com}
spring.ldap.password=${LDAP_PASSWORD:}

ldap.users.base=${LDAP_USERS_BASE:ou=users,dc=mairie,dc=com}

# Database
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/taxCollect}
# spring.datasource.username=${DB_USERNAME:directus}
# spring.datasource.password=${DB_PASSWORD:}
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
# spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1

# Active profile (set via env: spring.profiles.active=dev for development)
#spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Keycloak / OAuth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/mairie}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

jwt.auth.converter.resource-id=${JWT_RESOURCE_ID:tax-backend}
jwt.auth.converter.principal-attribute=preferred_username

# Keycloak admin settings
keycloak.admin.host=${KEYCLOAK_ADMIN_HOST:http://localhost:8080}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:mairie}
keycloak.admin.clientId=${KEYCLOAK_ADMIN_CLIENT_ID:keycloak-admin-client}
keycloak.admin.clientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Swagger / OpenAPI
springdoc.show-actuator=${SPRINGDOC_SHOW_ACTUATOR:false}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}