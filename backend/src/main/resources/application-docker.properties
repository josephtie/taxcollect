# Docker profile - all services running in Docker containers via docker-compose
# Activate with: spring.profiles.active=docker
# Used by docker-compose.yaml (SPRING_PROFILES_ACTIVE=docker)

# Database (host PostgreSQL on 5432 - holds the application schema, outside docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://host.docker.internal:5432/taxCollect}
spring.datasource.username=${DB_USERNAME:directus}
spring.datasource.password=${DB_PASSWORD:directus}

# LDAP (Docker OpenLDAP container)
spring.ldap.urls=ldap://openldap:389
spring.ldap.password=${LDAP_ADMIN_PASSWORD:admin}

# JPA - validate schema in Docker (Flyway manages migrations)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway - strict migration in Docker
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Keycloak (Docker container)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/mairie
keycloak.admin.host=http://keycloak:8080
keycloak.admin.clientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET:yp1Lwh1Lic2tJ9paQhzaj4KHkLiFYdnc}

# Swagger - disabled in Docker by default
springdoc.show-actuator=false
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# Logging - reduced verbosity in Docker
logging.level.com.nectuxingenieries.collect.tax=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
