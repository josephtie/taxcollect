# Development profile - Docker containers running locally
# Activate with: spring.profiles.active=dev
# Prerequisites: local PostgreSQL on 5432 (application data), docker-compose up (Keycloak on 8080, OpenLDAP on 389)

# Database (local PostgreSQL - holds the application schema)
spring.datasource.url=jdbc:postgresql://localhost:5432/taxCollect
spring.datasource.username=${DB_USERNAME:directus}
spring.datasource.password=${DB_PASSWORD:directus}

# LDAP (Docker OpenLDAP)
spring.ldap.urls=ldap://localhost:389
spring.ldap.password=${LDAP_ADMIN_PASSWORD:admin}

# JPA - show SQL in dev for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Keycloak (local Docker)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/mairie
keycloak.admin.host=http://localhost:8080
keycloak.admin.clientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET:IExzdiScWs6pKISjLiNiWALMcssZQRJN}

# Swagger
springdoc.show-actuator=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.nectuxingenieries.collect.tax=DEBUG
logging.level.org.springframework.security=DEBUG
