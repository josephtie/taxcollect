# Test profile - in-memory H2 database (no external dependencies)
spring.datasource.url=jdbc:h2:mem:taxcollect;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA - create schema from entities, no Flyway (migrations are PostgreSQL-specific)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

# LDAP - dummy values (no real connection during context load)
spring.ldap.urls=ldap://localhost:1389
spring.ldap.password=test

# Keycloak - dummy issuer (JwtDecoder is lazy, not contacted at startup)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/mairie
keycloak.admin.host=http://localhost:8080
keycloak.admin.clientSecret=test

# Swagger disabled in tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
