# Local profile - development without Docker containers
# Activate with: spring.profiles.active=local
# Prerequisites: PostgreSQL running locally on port 5432, Keycloak on 8080

# Database (local PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/taxCollect
spring.datasource.username=directus
spring.datasource.password=directus
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway - enabled but allow baseline
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Keycloak (local)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/mairie
keycloak.admin.host=http://localhost:8080
keycloak.admin.clientSecret=IExzdiScWs6pKISjLiNiWALMcssZQRJN

# Swagger - enabled for local dev
springdoc.show-actuator=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.nectuxingenieries.collect.tax=DEBUG
logging.level.org.springframework.security=DEBUG
