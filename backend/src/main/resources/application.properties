
spring.application.name=tax
server.port=${SERVER_PORT:9091}

#LDAP Configuration
spring.ldap.urls=${LDAP_URL:ldap://host.docker.internal:389}
spring.ldap.base=${LDAP_BASE:cn=admin,dc=mairie,dc=com}
spring.ldap.username=${LDAP_USERNAME:cn=admin,dc=mairie,dc=com}
spring.ldap.password=${LDAP_PASSWORD:}

ldap.users.base=${LDAP_USERS_BASE:ou=users,dc=mairie,dc=com}

# Database (overridden by profiles)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taxCollect}
spring.datasource.username=${DB_USERNAME:directus}
spring.datasource.password=${DB_PASSWORD:directus}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=10

# Active profile (set via env: spring.profiles.active=dev for development)
#spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Keycloak / OAuth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/mairie}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

jwt.auth.converter.resource-id=${JWT_RESOURCE_ID:tax-frontend}
jwt.auth.converter.principal-attribute=preferred_username

# Keycloak admin settings
keycloak.admin.host=${KEYCLOAK_ADMIN_HOST:http://localhost:8080}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:mairie}
keycloak.admin.clientId=${KEYCLOAK_ADMIN_CLIENT_ID:keycloak-admin-client}
keycloak.admin.clientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Swagger / OpenAPI
springdoc.show-actuator=${SPRINGDOC_SHOW_ACTUATOR:false}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}

# File upload
app.upload.dir=${UPLOAD_DIR:/Users/macbookpro2019/Documents/taxcollect/backend/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.kafka.enabled=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=taxcollect-payment
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Payment provider configuration
payment.provider.default-provider=STUB
payment.provider.providers.STUB.enabled=true
payment.provider.providers.STUB.sandbox=true
payment.provider.providers.PISPI.enabled=false
payment.provider.providers.PSP.enabled=false

# SMS Notification
sms.provider.enabled=${SMS_ENABLED:false}
sms.provider.api-url=${SMS_API_URL:}
sms.provider.api-key=${SMS_API_KEY:}
sms.provider.sender-name=${SMS_SENDER_NAME:TAXCOLLECT}