# ============================================================
# TaxCollect - Production Docker Compose for VPS / Portainer
#
# Architecture :
#
#   postgresTax
#       └── taxCollect
#              ↑
#          Backend
#
#   postgresKeycloak
#       └── keycloak_db
#              ↑
#          Keycloak
#
#   Keycloak ──► OpenLDAP
#   Backend  ──► Keycloak
#   Backend  ──► Redis
#   Backend  ──► Kafka
# ============================================================

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: postgresTax
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-directus}
      POSTGRES_DB: taxCollect
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - 15440:5432
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d taxCollect"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgresKeycloak
    restart: always
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-directus_KEYCLOAK}
    volumes:
      - pg_keycloak_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: keycloakTax
    restart: always
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_METRICS_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-directus_KEYCLOAK}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: http://13.140.180.9:18080
    ports:
      - 18080:8080
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm-mairie.json:/opt/keycloak/data/import/realm-mairie.json
    networks:
      - internal
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxcollect-backend
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/taxCollect
      DB_USERNAME: ${DB_USERNAME:-directus}
      DB_PASSWORD: ${DB_PASSWORD:-directus}
      KEYCLOAK_ISSUER_URI: http://13.140.180.9:18080/realms/mairie
      KEYCLOAK_ADMIN_HOST: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-L4kARi9SZe0AdjVGG4suLInRhE3st893}
      SPRING_PROFILES_ACTIVE: docker
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
      FLYWAY_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_NAME: ${SMS_SENDER_NAME:-TAXCOLLECT}
    ports:
      - 9091:9091
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: taxcollect-redis
    restart: always
    ports:
      - 16379:6379
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.1
    container_name: taxcollect-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - 19092:9092
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    container_name: taxcollect-prometheus
    restart: always
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    ports:
      - 19095:9090
    networks:
      - internal
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taxcollect-frontend
    restart: always
    ports:
      - 3001:80
    networks:
      - internal
    depends_on:
      backend:
        condition: service_started

volumes:
  pg_data:
  pg_keycloak_data:
  keycloak_data:

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'taxcollect-backend'
          metrics_path: '/actuator/prometheus'
          static_configs:
            - targets: ['backend:9091']

networks:
  internal:
    driver: bridge
